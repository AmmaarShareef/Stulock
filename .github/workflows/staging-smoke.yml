name: Staging smoke

on:
  workflow_dispatch:
    inputs:
      staging_base_url:
        description: HTTPS staging URL to verify
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stulock/eval exec playwright install --with-deps chromium
      - run: pnpm --filter @stulock/eval eval
        env:
          STAGING_BASE_URL: ${{ inputs.staging_base_url }}
